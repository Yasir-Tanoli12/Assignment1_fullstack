<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 - Part A</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top-bar">
    <h1 class="h4 mb-0">Task 1 - Part A: Core Features</h1>
  </header>

  <main class="container-fluid dashboard">

    <!-- Ticket Form -->
    <section class="card panel">
      <div class="card-body">
        <h2 class="h5 mb-3">Ticket Form</h2>
        <form id="ticketForm" novalidate>
          <div class="mb-3">
            <label for="customerName" class="form-label">Customer Name</label>
            <input type="text" id="customerName" class="form-control" placeholder="e.g. Ali Khan">
            <div class="invalid-feedback" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label for="issue" class="form-label">Issue</label>
            <textarea id="issue" rows="3" class="form-control" placeholder="Describe the problem"></textarea>
            <div class="invalid-feedback" id="issueError"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="priority" class="form-label">Priority</label>
              <select id="priority" class="form-select">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
              <div class="invalid-feedback" id="priorityError"></div>
            </div>
            <div class="col-6">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select">
                <option value="Open" selected>Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
              </select>
              <div class="invalid-feedback" id="statusError"></div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Add Ticket</button>
            <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Ticket View -->
    <section class="card panel">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h2 class="h5 mb-0">Ticket View</h2>
          <div class="counts">
            <span class="badge text-bg-dark">Total: <span id="totalCount">0</span></span>
            <span class="badge text-bg-success">Open: <span id="openCount">0</span></span>
          </div>
        </div>
        <div id="ticketList" class="ticket-grid"></div>
        <p id="emptyMsg" class="text-muted mb-0">No tickets yet.</p>
      </div>
    </section>

  </main>

  <script src="js/task1.js"></script>
</body>
</html>
