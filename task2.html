<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Part B</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top-bar">
    <h1 class="h4 mb-0">Task 2 - Part B: Additional Features</h1>
  </header>

  <main class="container-fluid dashboard">

    <!-- Ticket Form (add / edit) -->
    <section class="card panel">
      <div class="card-body">
        <h2 class="h5 mb-3" id="formTitle">Add Ticket</h2>
        <form id="ticketForm" novalidate>
          <div class="mb-3">
            <label for="customerName" class="form-label">Customer Name</label>
            <input type="text" id="customerName" class="form-control" placeholder="e.g. Ali Khan">
            <div class="invalid-feedback" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label for="issue" class="form-label">Issue</label>
            <textarea id="issue" rows="3" class="form-control" placeholder="Describe the problem"></textarea>
            <div class="invalid-feedback" id="issueError"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="priority" class="form-label">Priority</label>
              <select id="priority" class="form-select">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
            <div class="col-6">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select">
                <option value="Open" selected>Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Ticket</button>
            <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Summary, Search & Filter, Ticket list -->
    <section class="card panel">
      <div class="card-body">

        <h2 class="h5 mb-3">Ticket Summary</h2>
        <div class="summary mb-4">
          <div class="summary-box"><span id="sumOpen">0</span><small>Open</small></div>
          <div class="summary-box"><span id="sumProgress">0</span><small>In Progress</small></div>
          <div class="summary-box"><span id="sumClosed">0</span><small>Closed</small></div>
        </div>

        <h2 class="h5 mb-3">Search &amp; Filter</h2>
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Search issue keyword">
          </div>
          <div class="col-6 col-md-3">
            <select id="filterStatus" class="form-select">
              <option value="All">All Status</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="filterPriority" class="form-select">
              <option value="All">All Priority</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Tickets</h2>
          <span class="badge text-bg-dark" id="shownCount">Showing 0 of 0</span>
        </div>
        <div id="ticketList" class="ticket-grid"></div>
        <p id="emptyMsg" class="text-muted mb-0">No tickets found.</p>
      </div>
    </section>

  </main>

  <script type="module" src="js/task2/main.js"></script>
</body>
</html>
